<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 376" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>freeRASP's two channels on iOS, and where Frida hooks each</title>
<desc>Down channel (ignition): JavaScript talsecStart(cfg) → talsecStart ignition method → Talsec.start, engine on. Up channel (reporting): SecurityThreatCenter → ThreatDispatcher → sendEventWithName:body: reporting method → JavaScript threat callback. A central Frida node hooks both bridge methods: hooking talsecStart means the engine never starts; hooking sendEventWithName:body: means JS never hears the threat. Both methods belong to the one FreeraspReactNative module.</desc>
<style>
  :root{
    --mono:'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace;
    --text:#3d3d3a; --muted:#73726c;
    --g-f:#F1EFE8; --g-s:#5F5E5A; --g-t:#2C2C2A;
    --rd-f:#FCEBEB; --rd-s:#A32D2D; --rd-t:#791F1F;
    --surf-f:#FBFAF7; --surf-t:#2C2C2A;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --text:#c2c0b6; --muted:#9c9a92;
      --g-f:#444441; --g-s:#B4B2A9; --g-t:#D3D1C7;
      --rd-f:#791F1F; --rd-s:#F09595; --rd-t:#F7C1C1;
      --surf-f:#35342F; --surf-t:#D3D1C7;
    }
  }
  .th{font-size:14px;font-weight:500}
  .ts{font-size:12px;font-weight:400}
  .mono{font-family:var(--mono)}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="145" y="44" text-anchor="middle" dominant-baseline="central" fill="#D85A30">Down · ignition</text>
<text class="th" x="535" y="44" text-anchor="middle" dominant-baseline="central" fill="#1D9E75">Up · reporting</text>

<rect x="40" y="124" width="600" height="92" rx="12" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="5 4"/>
<text class="ts" x="162" y="137" text-anchor="start" dominant-baseline="central" fill="var(--muted)">FreeraspReactNative</text>

<rect x="40" y="56" width="210" height="52" rx="8" fill="var(--g-f)" stroke="var(--g-s)" stroke-width="1"/>
<text class="th" x="145" y="76" text-anchor="middle" dominant-baseline="central" fill="var(--g-t)">JavaScript call</text>
<text class="ts mono" x="145" y="94" text-anchor="middle" dominant-baseline="central" fill="var(--g-t)">talsecStart(cfg)</text>

<rect x="40" y="148" width="210" height="56" rx="8" fill="var(--surf-f)" stroke="#E24B4A" stroke-width="1.5"/>
<text class="th" x="145" y="168" text-anchor="middle" dominant-baseline="central" fill="var(--surf-t)">talsecStart</text>
<text class="ts" x="145" y="188" text-anchor="middle" dominant-baseline="central" fill="var(--surf-t)">ignition method</text>

<rect x="40" y="244" width="210" height="56" rx="8" fill="var(--g-f)" stroke="var(--g-s)" stroke-width="1"/>
<text class="th" x="145" y="264" text-anchor="middle" dominant-baseline="central" fill="var(--g-t)">Talsec.start()</text>
<text class="ts" x="145" y="284" text-anchor="middle" dominant-baseline="central" fill="var(--g-t)">engine turns ON</text>

<line x1="145" y1="108" x2="145" y2="146" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="145" y1="204" x2="145" y2="242" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="430" y="56" width="210" height="52" rx="8" fill="var(--g-f)" stroke="var(--g-s)" stroke-width="1"/>
<text class="th" x="535" y="76" text-anchor="middle" dominant-baseline="central" fill="var(--g-t)">JavaScript</text>
<text class="ts" x="535" y="94" text-anchor="middle" dominant-baseline="central" fill="var(--g-t)">threat callback fires</text>

<rect x="430" y="148" width="210" height="56" rx="8" fill="var(--surf-f)" stroke="#E24B4A" stroke-width="1.5"/>
<text class="ts mono" x="535" y="168" text-anchor="middle" dominant-baseline="central" fill="var(--surf-t)">sendEventWithName:body:</text>
<text class="ts" x="535" y="188" text-anchor="middle" dominant-baseline="central" fill="var(--surf-t)">reporting method</text>

<rect x="430" y="244" width="210" height="56" rx="8" fill="var(--g-f)" stroke="var(--g-s)" stroke-width="1"/>
<text class="th" x="535" y="264" text-anchor="middle" dominant-baseline="central" fill="var(--g-t)">SecurityThreatCenter</text>
<text class="ts" x="535" y="284" text-anchor="middle" dominant-baseline="central" fill="var(--g-t)">→ ThreatDispatcher</text>

<line x1="535" y1="242" x2="535" y2="206" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="535" y1="146" x2="535" y2="110" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="290" y="150" width="100" height="56" rx="8" fill="var(--rd-f)" stroke="var(--rd-s)" stroke-width="1"/>
<text class="th" x="340" y="170" text-anchor="middle" dominant-baseline="central" fill="var(--rd-t)">Frida</text>
<text class="ts" x="340" y="188" text-anchor="middle" dominant-baseline="central" fill="var(--rd-t)">hooks</text>

<line x1="288" y1="178" x2="253" y2="178" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="392" y1="178" x2="427" y2="178" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text class="ts" x="145" y="320" text-anchor="middle" dominant-baseline="central" fill="var(--text)">hook → engine never starts</text>
<text class="ts" x="535" y="320" text-anchor="middle" dominant-baseline="central" fill="var(--text)">hook → JS never hears it</text>
<text class="ts" x="340" y="350" text-anchor="middle" dominant-baseline="central" fill="var(--muted)" opacity="0.8">waseeq14.github.io</text>
</svg>
